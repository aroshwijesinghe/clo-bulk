<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Order Clothing | Group Buying</title>
    <meta name="description" content="Join group buying campaigns for clothing to get the best bulk order discounts.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">BulkThreads</div>
                <ul class="nav-links">
                    <li><a href="#campaigns">Active Campaigns</a></li>
                    <li><a href="#how-it-works">How It Works</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div id="auth-container">
                    <div id="g_id_onload"
                         data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
                         data-callback="handleCredentialResponse"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                         data-type="standard"
                         data-size="large"
                         data-theme="outline"
                         data-text="sign_in_with"
                         data-shape="rectangular"
                         data-logo_alignment="left">
                    </div>
                </div>
                <div id="user-profile" style="display: none; align-items: center; gap: 10px;">
                    <img id="user-avatar" src="" alt="User Avatar" style="width: 40px; height: 40px; border-radius: 50%;">
                    <span id="user-name" style="font-weight: 600;"></span>
                    <button id="sign-out-btn" class="btn btn-primary" style="padding: 5px 10px; font-size: 0.8rem;">Sign Out</button>
                </div>
            </nav>
            <div class="hero">
                <h1>Unlock Wholesale Prices Together</h1>
                <p>Join group buying campaigns for premium clothing and unlock exclusive bulk order discounts.</p>
                <button class="btn btn-large">Browse Campaigns</button>
            </div>
        </div>
    </header>

    <main>
        <section id="campaigns" class="container">
            <h2>Trending Group Buys</h2>
            <div class="campaign-grid">
                <!-- Campaign cards will be injected here via JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 BulkThreads. All rights reserved.</p>
        </div>
    </footer>

    <script src="./js/main.js"></script>
</body>
</html>
