name: Keep Supabase Alive

# Runs every 3 days to prevent Supabase free-tier project from pausing
on:
  schedule:
    # Run every 3 days at 04:00 UTC (avoids midnight contention and guarantees activity well before 7-day cutoff)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep it alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🏓 Pinging Supabase at $(date -u)..."

          # Normalize URL (strip trailing slash and add protocol if missing)
          SUPABASE_BASE_URL="${SUPABASE_URL%/}"
          if [[ "$SUPABASE_BASE_URL" != http://* && "$SUPABASE_BASE_URL" != https://* ]]; then
            SUPABASE_BASE_URL="https://${SUPABASE_BASE_URL}"
          fi

          echo "1️⃣ Querying database..."
          curl -sS --retry 3 --retry-delay 2 --retry-all-errors \
            "${SUPABASE_BASE_URL}/rest/v1/Campaign?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" > /dev/null

          echo "2️⃣ Inserting keepalive record..."
          RESPONSE=$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors -w "\n%{http_code}" \
            "${SUPABASE_BASE_URL}/rest/v1/LoginHistory" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"email\": \"keepalive@github-actions.bot\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response code: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Supabase is alive! Keepalive record inserted."
          else
            echo "❌ Failed to ping Supabase (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "3️⃣ Cleaning up old keepalive records..."
          curl -sS --retry 3 --retry-delay 2 --retry-all-errors -o /dev/null \
            "${SUPABASE_BASE_URL}/rest/v1/LoginHistory?email=eq.keepalive@github-actions.bot&order=login_time.desc&offset=3" \
            -X DELETE \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"

          echo "🎉 Done! Supabase project will stay active."
